## Rootine Project Configuration
## Copy this to rootine.config.yaml and edit for your project.
## Generated by: rootine init

project:
  name: "my-project"
  owner: "Your Name"
  tier: personal              # starter | personal | medium
  timezone: "America/Chicago" # used for ceremony scheduling and work windows

ai:
  providers:
    primary:
      lead_dev:
        provider: anthropic
        model: "claude-sonnet-4-6"
        daily_token_cap: 40000
        weekly_token_cap: 200000
        cost_per_1m_in: 3.00
        cost_per_1m_out: 15.00
      associate:
        provider: openai
        model: "gpt-4.1"
        daily_token_cap: 80000
        weekly_token_cap: 400000
        cost_per_1m_in: 2.00
        cost_per_1m_out: 8.00
      po_agent:
        provider: openai
        model: "gpt-4o-mini"
        daily_token_cap: 20000
        weekly_token_cap: 100000
        cost_per_1m_in: 0.15
        cost_per_1m_out: 0.60
    fallback:
      lead_dev:
        provider: deepseek
        model: "deepseek-chat"
        cost_per_1m_in: 0.27
        cost_per_1m_out: 1.10
      associate:
        provider: deepseek
        model: "deepseek-coder"
        cost_per_1m_in: 0.14
        cost_per_1m_out: 0.28
      po_agent:
        provider: google
        model: "gemini-2.0-flash"
        cost_per_1m_in: 0.00
        cost_per_1m_out: 0.00

work_schedule:
  ai_hours_per_day: 5
  human_hours_per_week: 10
  work_window: "08:00-22:00"
  sprint_days: 7                # Saturday to Friday

hooks:
  enabled:
    - daily_cap
    - weekly_cap
    - work_window
    - paused_registry
    - budget_guard
  paused_registry:
    registry_path: "agents/state/paused-epics.yaml"

alerts:
  thresholds: [50, 80, 100]
  slack_channel: "#dev"
  mention_at: ["@owner"]
  deduplicate_minutes: 60

ceremonies:
  # Set to false to disable (starter tier disables most by default)
  sprint_planning: true
  sunday_kickoff: true
  daily_standup: true
  daily_report: true
  sprint_review: true
  sprint_retro: true
  backlog_refinement: true
